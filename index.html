<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#130b20">
  <title>🍻 Party Shots - Drinking Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg-animated"></div>

  <div class="app-container">
    <header class="topbar">
      <h1>PARTY SHOTS </h1>
      <p class="tagline">Drink. Dare. Repeat.</p>
    </header>

    <main class="game-area">
      <section class="card question-card">
        <div class="question-wrapper">
          <div class="question" id="question">Click <strong>"Next Round"</strong> to start the madness!</div>
        </div>
        <button class="btn btn-primary btn-massive" id="nextBtn" onclick="showRandomQuestion()">🎲 NEXT ROUND</button>
      </section>

      <section class="card players-card">
        <div class="players-header">
          <h3>👥 Players & Scores</h3>
        </div>

        <div class="players-grid" id="playersGrid">
          <div class="empty-state" id="emptyState">No players yet. Add below! 🍺</div>
        </div>

        <div class="add-player-row">
          <input type="text" id="playerName" placeholder="Enter player name..." maxlength="12">
          <button class="btn btn-accent" onclick="addPlayer()">Add</button>
        </div>
        <p id="error"></p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
